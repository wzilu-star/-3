# ============================================================
# 白酒行业财报 RAG 知识库 · 全局配置
# 改公司清单 / 参数，只需要改这一个文件
# ============================================================

project:
  name: baijiu-finrag
  industry: 白酒
  # 报告类型：年报 / 半年报。首次跑建议只做「年报」，稳定后再加半年报
  report_type: 年报
  period: 2024

# ---------- 公司清单（12 家，10 家保底 + 2 家备胎）----------
companies:
  - { name: 贵州茅台, code: "600519", exchange: sse }
  - { name: 五粮液,   code: "000858", exchange: szse }
  - { name: 泸州老窖, code: "000568", exchange: szse }
  - { name: 山西汾酒, code: "600809", exchange: sse }
  - { name: 洋河股份, code: "002304", exchange: szse }
  - { name: 古井贡酒, code: "000596", exchange: szse }
  - { name: 今世缘,   code: "603369", exchange: sse }
  - { name: 迎驾贡酒, code: "603198", exchange: sse }
  - { name: 口子窖,   code: "603589", exchange: sse }
  - { name: 舍得酒业, code: "600702", exchange: sse }
  - { name: 水井坊,   code: "600779", exchange: sse }
  - { name: 老白干酒, code: "600559", exchange: sse }

# ---------- 抽取 ----------
extract:
  min_pdf_bytes: 200000        # PDF 小于这个大小视为下载失败
  drop_repeated_lines: true    # 剔除重复页眉页脚
  repeated_ratio: 0.5          # 同一行在 >50% 页面出现即视为页眉/页脚
  section_regex: "第[一二三四五六七八九十]+节\\s*[^\\n]{0,30}"

# ---------- 切块 ----------
chunk:
  text_min_chars: 400          # 目标最小长度
  text_max_chars: 700          # 目标最大长度
  overlap_chars: 100           # 相邻块重叠
  table_max_rows: 60           # 单表超过这么多行才按行拆分
  inject_context_header: true  # 块首注入【公司·代码·报告期·章节·页码】

# ---------- 索引与检索 ----------
index:
  # 检索后端：
  #   faiss = 正式方案（FAISS 向量 + jieba/BM25，语义检索，效果好，需装依赖+下bge-m3权重）
  #   light = 轻量降级（纯标准库 TF-IDF + BM25，零依赖，换台机器就能跑，
  #           但不是语义向量、不做同义泛化，仅用于演示与联调）
  #   auto  = 自动选择（默认）：能 import faiss 与 sentence_transformers 就用 faiss，否则降级 light
  backend: auto
  embed_model: BAAI/bge-m3     # 中文财报效果好；显存小可换 BAAI/bge-large-zh-v1.5
  embed_batch_size: 32
  vector_dir: index/faiss
  bm25_path: index/bm25.pkl
  bm25_dict: index/finance_dict.txt
  light_path: index/light_index.pkl   # light 后端的索引文件

retrieve:
  vector_top_k: 20             # 向量召回数
  bm25_top_k: 20               # BM25 召回数
  rrf_k: 60                    # RRF 融合常数
  final_top_k: 6               # 送入 LLM 的最终块数
  use_reranker: false          # 需要时装 sentence-transformers 里的 bge-reranker-base
  reranker_model: BAAI/bge-reranker-base
  # 跨公司全景题：每家公司保底召回数
  per_company_quota: 3
  # 跨公司全景题单独放宽的最终块数。
  # 必须 ≥ 参与比较的公司数，否则配额白做——
  # 例：12家公司各召回3块共36块，若仍按 final_top_k=6 截断，
  # 结果只剰前两家公司，正是配额要解决的「单公司霸榜」问题反向复现。
  panorama_top_k: 36

# ---------- 生成 ----------
generate:
  # ollama(本地) | openai(在线API) | none(只展示检索结果，不生成)
  # demo  = 无需任何模型：用抽取式方式把最相关片段拼成"参考答案"，
  #         让页面在完全离线的环境下也有可看的效果
  provider: demo
  ollama_model: qwen2.5:7b
  ollama_base_url: http://localhost:11434
  openai_model: gpt-4o-mini
  temperature: 0.1
  max_tokens: 1024

# ---------- 路径 ----------
paths:
  raw_dir: data/raw
  extracted_dir: data/extracted
  chunks_path: data/chunks/chunks.jsonl
  # 没有真实 PDF 时，可直接指向仿真数据来跑通整条链路
  demo_chunks_path: demo/chunks/chunks.jsonl
  manifest_path: data/raw/manifest.csv
  eval_dir: eval
