# ============================================================
# 评测题库：10 道，其中跨公司/全景题 3 道（要求 ≥2）
# 类型分布：单指标抽取 3 / 表格多指标 2 / 跨年度对比 2 / 跨公司全景 3
# ============================================================
questions:
  # ---------- 单公司 · 单指标抽取（3 道）----------
  - id: Q01
    type: 单公司-单指标
    question: 贵州茅台2024年实现营业收入是多少？同比增速是多少？
    gold: 需人工从年报「主要会计数据」表核对（含单位与口径）

  - id: Q02
    type: 单公司-单指标
    question: 泸州老窖2024年归属于上市公司股东的净利润是多少？
    gold: 需人工核对（注意归母 vs 净利润口径）

  - id: Q03
    type: 单公司-单指标
    question: 山西汾酒2024年经营活动产生的现金流量净额是多少？
    gold: 需人工核对（现金流量表口径）

  # ---------- 单公司 · 表格/多指标（2 道）----------
  - id: Q04
    type: 单公司-表格多指标
    question: 贵州茅台2024年分产品（茅台酒、系列酒）的营业收入和毛利率分别是多少？
    gold: 来自「主营业务分行业、分产品情况」表

  - id: Q05
    type: 单公司-表格多指标
    question: 洋河股份2024年分地区的营业收入及占比情况如何？
    gold: 来自「分地区」表格

  # ---------- 单公司 · 跨年度对比（2 道）----------
  - id: Q06
    type: 跨年度对比
    question: 五粮液2024年营业收入相比2023年增长了多少？
    gold: 需同时用到本期与上年同期数据

  - id: Q07
    type: 跨年度对比
    question: 古井贡酒近两年（2023、2024）的销售费用率变化趋势如何？
    gold: 销售费用 ÷ 营业收入，需两期数据

  # ---------- 跨公司 · 全景/比较（3 道，必做）----------
  - id: Q08
    type: 跨公司-全景
    question: 2024年这12家白酒公司中，哪一家的毛利率最高？它的毛利率是多少？
    gold: 需逐家检索并排序（考察配额召回是否生效）

  - id: Q09
    type: 跨公司-全景
    question: 2024年哪些白酒公司的营业收入出现了同比下滑？
    gold: 需在多家公司中找到负增长者（考察覆盖度）

  - id: Q10
    type: 跨公司-全景聚合
    question: 这12家白酒公司2024年的营业收入合计大约是多少？行业整体规模如何？
    gold: 需先逐家抽取数值再求和（最易翻车，结论重点分析）
